# Gate on the mesh definition itself.
#
# Merging here redeploys the mesh, so this is the last point at which a wiring
# mistake is cheap. On 2026-09-06 one got through: a restructure re-pointed a
# consumer at a channel nothing wrote to, publishes were silently discarded for
# two and a half hours, and every service stayed green throughout. The defect was
# in mesh.yaml the whole time and takes a second to find mechanically.
#
# In a two-mesh setup (develop -> dev mesh, main -> prod mesh) this is a required
# check on the promotion PR, not just on push.
name: Verify mesh

on:
  push:
    paths:
      - 'mesh/**'
      - '.github/workflows/verify-mesh.yaml'
      - 'scripts/mesh/**'
      - 'scripts/search/**'
  pull_request:
    paths:
      - 'mesh/**'
      - '.github/workflows/verify-mesh.yaml'
      - 'scripts/mesh/**'
      - 'scripts/search/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wiring:
    name: Channel wiring
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Fails when any channel is produced but never consumed, or consumed but
      # never produced. Deliberate dead ends are declared in
      # mesh/.wiring-allow-orphans with a reason.
      - name: Every channel has a producer and a consumer
        run: python3 scripts/mesh/check-wiring.py mesh/mesh.yaml

      # A regression test for the checker itself, run against a committed fixture
      # (the mesh as it stood during the 2026-09-06 outage, from cbd8dc1^) rather
      # than this repository's git history. The first version grepped the log for
      # the outage commit and skipped when it found nothing, which is exactly what
      # happens in a repo copied from this one, or in a shallow clone: the guard on
      # the guard quietly did nothing. A fixture travels.
      - name: The checker still rejects the 2026-09-06 outage mesh
        run: |
          set -uo pipefail
          fixture=scripts/mesh/testdata/outage-mesh.yaml
          if python3 scripts/mesh/check-wiring.py "$fixture" > /tmp/out.txt 2>&1; then
            echo "::error::check-wiring.py PASSED the mesh that caused the 2026-09-06 outage."
            echo "::error::It is no longer detecting the failure it exists to detect."
            cat /tmp/out.txt
            exit 1
          fi
          grep -q 'inbox.pages is produced but never consumed' /tmp/out.txt \
            && grep -q 'relay.pages is consumed but never produced' /tmp/out.txt \
            || { echo "::error::rejected the outage mesh, but not for the expected reasons:"; cat /tmp/out.txt; exit 1; }
          echo "ok: the outage mesh is still rejected, for both of its original faults."

  migrations:
    name: Service-init migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The painless and the search template live readable under mesh/sources/
      # and are built into .http migrations. This fails when a committed
      # migration is not what its sources build, and when a migration that has
      # already run on the mesh (scripts/mesh/APPLIED.sha256) has changed, which
      # would fail its checksum at sink startup and block every later one.
      # scripts/mesh/test_search_local.py runs them against a real OpenSearch;
      # it needs one, so it is run by hand before a PR, not here.
      - name: Migrations match their sources, and applied ones are unchanged
        run: python3 scripts/mesh/build-migrations.py check

  tools:
    name: Search tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Against a fake edge and a fake clock: no network here.
      - name: The deploy-watch tool
        run: python3 scripts/search/test_watch_search.py
