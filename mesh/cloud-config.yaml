---
global:
  services:
    ingestion:
      rest-ingestion:
        replicas: 1
    processing:
      rendering-engine:
        stateful: true
      indexable-resources-sql-transformer:
        stateful: true
    edge:
      opensearch-sink:
        replicas: 1
        stateful: true
      web-server-sink:
        replicas: 1
        stateful: true
clusters:
  eu-west-par-edge:
    enabled: false
    overlay: {}
  eu-west-par-processing:
    enabled: false
    overlay: {}
  eu-south-mil-processing:
    enabled: true
    overlay: {}
  ap-southeast-sin-edge:
    enabled: false
    overlay: {}
  eu-south-mil-edge:
    enabled: true
    overlay: {}
