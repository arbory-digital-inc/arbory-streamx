streamx.blueprints.indexable-resources-producer.index-fragments=false
streamx.blueprints.indexable-resources-producer.include-facets=true
streamx.blueprints.indexable-resources-producer.configurations.eds.selector=meta[property^=facets:]
streamx.blueprints.indexable-resources-producer.configurations.eds.keys=property
streamx.blueprints.indexable-resources-producer.configurations.eds.key-delimiter=facets:
streamx.blueprints.indexable-resources-producer.configurations.eds.values=content

# RSM-style taxonomy. EDS renders the authored `searchtags` metadata row as a
# single <meta name="searchtags"> whose content holds every entry, comma-joined:
#   Arbory Display | Content type / Blogs, Arbory Display | tags / AEM, ...
# The `eds` configuration above cannot pick it up - that selector requires a
# `facets:` prefix - so capture it here under the key `searchtags`. It lands in
# payload.facets.searchtags as one opaque string and is split into
# category_level0/1 + category_hierarchy by the default-local ingest pipeline
# (see mesh/configs/opensearch/service-init/V1.0.0.7.1__*_default_pipeline.http),
# because a single meta tag cannot carry the array that multi-value faceting
# needs.
streamx.blueprints.indexable-resources-producer.configurations.searchtags.selector=meta[name=searchtags]
streamx.blueprints.indexable-resources-producer.configurations.searchtags.keys=name
streamx.blueprints.indexable-resources-producer.configurations.searchtags.values=content

streamx.blueprints.indexable-resources-producer.configurations.color.single-attr=true
streamx.blueprints.indexable-resources-producer.configurations.color.selector=div.test
streamx.blueprints.indexable-resources-producer.configurations.color.keys=color

streamx.blueprints.indexable-resources-producer.configurations.nested.selector=meta[name^=facets:]
streamx.blueprints.indexable-resources-producer.configurations.nested.keys=name
streamx.blueprints.indexable-resources-producer.configurations.nested.key-delimiter=facets:
streamx.blueprints.indexable-resources-producer.configurations.nested.values=value
streamx.blueprints.indexable-resources-producer.configurations.nested.hierarchical-facet-delimiter=>