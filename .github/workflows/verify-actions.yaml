# Keep the internalized StreamX connector action fit for an org with an actions
# allow-list.
#
# The property that matters — "this action references no third-party action" —
# cannot be observed by running the action. It breaks in the CONSUMING repo, in
# someone else's org, at publish time. So it is asserted here, in the repo that
# owns the copy, on every change to it.
#
# Note that every step below is bash or an `actions/*` action, exactly like the
# action it verifies. That is not decoration: this file gets copied into
# a customer's own StreamX configuration repo alongside the action, and has to
# run there too.
name: Verify StreamX actions

on:
  push:
    paths:
      - '.github/actions/**'
      - '.github/workflows/verify-actions.yaml'
      - 'scripts/vendor/**'
      - 'docs/upstream/**'
  pull_request:
    paths:
      - '.github/actions/**'
      - '.github/workflows/verify-actions.yaml'
      - 'scripts/vendor/**'
      - 'docs/upstream/**'
  schedule:
    # Weekly, to notice upstream moving. `@v1` upstream is a branch, so it can
    # change with no version bump and nothing else would tell us.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No arguments: checks every action under .github/actions/.
      - name: Assert the actions are allow-list safe
        run: bash scripts/vendor/check-allowlist-safety.sh

      - name: Shellcheck the vendoring scripts
        run: shellcheck scripts/vendor/*.sh

  smoke:
    name: Smoke test the internalized JBang path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same version and distribution the action itself uses, because this job
      # is testing what happens after that step.
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      # Read the pins out of action.yml rather than repeating them, so this
      # tests the values that actually ship.
      - name: Read the pinned versions from action.yml
        id: pins
        run: |
          set -euo pipefail
          action_yml=.github/actions/connector-github/action.yml
          jbang_version="$(sed -n "s/^[[:space:]]*JBANG_VERSION:[[:space:]]*'\([^']*\)'.*/\1/p" "$action_yml" | head -1)"
          jbang_sha="$(sed -n "s/^[[:space:]]*JBANG_SHA256:[[:space:]]*'\([^']*\)'.*/\1/p" "$action_yml" | head -1)"
          connector="$(sed -n 's/.*com\.streamx:streamx-github-connector:\([0-9][^ ]*\).*/\1/p' "$action_yml" | head -1)"
          [ -n "$jbang_version" ] && [ -n "$jbang_sha" ] && [ -n "$connector" ] || {
            echo "::error::could not read the pins out of ${action_yml}"; exit 1; }
          echo "jbang_version=${jbang_version}" >> "$GITHUB_OUTPUT"
          echo "jbang_sha=${jbang_sha}" >> "$GITHUB_OUTPUT"
          echo "connector=${connector}" >> "$GITHUB_OUTPUT"
          echo "JBang ${jbang_version}, connector ${connector}"

      - name: Install JBang from the pinned, checksummed release
        env:
          JBANG_VERSION: ${{ steps.pins.outputs.jbang_version }}
          JBANG_SHA256: ${{ steps.pins.outputs.jbang_sha }}
        run: bash .github/actions/connector-github/install-jbang.sh

      - name: Register the JDK with JBang
        run: jbang jdk install 21 "${JAVA_HOME_21_X64:-$JAVA_HOME}"

      # The step above is the reason the connector does not spend ~200MB
      # downloading a second JDK, and nothing else here would notice if it
      # stopped working — `jbang --java 21` would just silently fetch its own.
      # Asserting the version JBang actually runs under closes that gap.
      - name: Check that --java 21 resolves to the linked JDK
        run: |
          set -euo pipefail
          cat > /tmp/WhichJava.java <<'JAVA'
          public class WhichJava {
            public static void main(String[] args) {
              System.out.println("jbang-java-version=" + Runtime.version().feature());
            }
          }
          JAVA
          jbang --java 21 /tmp/WhichJava.java | tee /tmp/whichjava.txt
          grep -qx 'jbang-java-version=21' /tmp/whichjava.txt || {
            echo "::error::jbang --java 21 did not run on the linked JDK 21"; exit 1; }

      # Resolution is the part that can break without anyone noticing: it
      # reaches a third-party Maven registry over the network. `info classpath`
      # resolves the artifact and all its transitive dependencies and prints the
      # result WITHOUT running the connector, so no CloudEvent is ever sent.
      - name: Resolve the connector artifact
        run: |
          set -euo pipefail
          jbang info classpath \
            --fresh \
            --repos 'streamx-maven-public-releases=https://europe-west1-maven.pkg.dev/streamx-releases/streamx-maven-public-releases/' \
            --repos 'mavencentral' \
            'com.streamx:streamx-github-connector:${{ steps.pins.outputs.connector }}' \
            | tee classpath.txt
          if ! grep -q 'streamx-github-connector' classpath.txt; then
            echo "::error::the resolved classpath does not contain the connector jar"
            exit 1
          fi
          echo "Resolved $(tr ':' '\n' < classpath.txt | grep -c '\.jar$' || true) jars."

  upstream-drift:
    name: Upstream drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare upstream v1/v2 against the recorded snapshots
        run: bash scripts/vendor/check-upstream-drift.sh

  verify-indexed-smoke:
    name: Smoke test the index verifier
    runs-on: ubuntu-latest
    # Skipped until a delivery URL is configured, so a fresh copy of this repo in
    # another org is green rather than red-on-arrival.
    if: vars.STREAMX_DELIVERY_URL != ''
    steps:
      - uses: actions/checkout@v7

      # Hardcoding a known-good document id would couple this job to content that
      # can be unpublished at any time. Asking the index what it holds keeps the
      # test self-maintaining.
      - name: Pick a document that is definitely indexed
        id: pick
        run: |
          set -euo pipefail
          subject="$(curl --fail --silent --show-error --location --max-time 45 \
            --get --data-urlencode 'size=1' \
            "${{ vars.STREAMX_DELIVERY_URL }}/search/pages/" \
            | jq -r '.hits.hits[0]._id // empty')"
          if [ -z "$subject" ]; then
            echo "::error::The index returned no documents, so there is nothing to verify against."
            exit 1
          fi
          echo "subject=${subject}" >> "$GITHUB_OUTPUT"
          echo "Using ${subject}"

      - name: A document that IS indexed reads as present
        uses: ./.github/actions/verify-indexed
        with:
          delivery-url: ${{ vars.STREAMX_DELIVERY_URL }}
          subject: ${{ steps.pick.outputs.subject }}
          timeout-seconds: '60'

      - name: A document that is NOT indexed reads as absent
        uses: ./.github/actions/verify-indexed
        with:
          delivery-url: ${{ vars.STREAMX_DELIVERY_URL }}
          subject: 'en:/en/this-document-does-not-exist-smoke-test'
          expect: absent
          timeout-seconds: '60'

      # A verifier that cannot fail is not a verifier. This asserts the negative
      # path actually reports failure rather than quietly passing.
      - name: A missing document must FAIL a present check
        id: mustfail
        continue-on-error: true
        uses: ./.github/actions/verify-indexed
        with:
          delivery-url: ${{ vars.STREAMX_DELIVERY_URL }}
          subject: 'en:/en/this-document-does-not-exist-smoke-test'
          expect: present
          timeout-seconds: '0'

      - name: Assert that check really did fail
        run: |
          if [ "${{ steps.mustfail.outcome }}" != "failure" ]; then
            echo "::error::verify-indexed passed a check it should have failed (outcome: ${{ steps.mustfail.outcome }})."
            exit 1
          fi
          echo "ok: verify-indexed correctly failed on a document that is not indexed."
