default:
  environment:
    STREAMX_BLUEPRINTS_KEY_VALUE_STATE_REPOSITORY_BACKEND: rocksdb
    STREAMX_BLUEPRINTS_KEY_VALUE_STATE_REPOSITORY_ROCKSDB_PATH: /var/lib/rocksdb

descriptors:
  relay:
    type: processing
    containers:
      service:
        incoming:
          events: {}
        outgoing:
          relayed-events: {}

  indexable-resources-producer:
    type: processing
    containers:
      processor:
        image: ghcr.io/streamx-hub/streamx-blueprints/indexable-resources-producer:3.0.27-native
        incoming:
          pages: {}
          fragments: {}
        outgoing:
          indexable-resources: {}
          indexable-resource-fragments: {}

  indexable-resources-sql-transformer:
    type: processing
    volumes:
      sqlitedb:
        size: 5Gi
    containers:
      processor:
        image: ghcr.io/streamx-hub/streamx-blueprints/indexable-resources-sql-transformer:3.0.27-native
        incoming:
          indexable-resources: { }
        outgoing:
          transformations: { }
        autoRef:
          - from: indexable-resources
            to: indexable-resources-state
            using: sync-state
        volumes:
          - sqlitedb:/var/lib/sqlitedb
        environment:
          STREAMX_BLUEPRINTS_SQL_STATE_REPOSITORY_SQLITE_PATH: /var/lib/sqlitedb

  rendering-engine:
    type: processing
    volumes:
      rocksdb:
        size: 5Gi
    containers:
      processor:
        image: ghcr.io/streamx-hub/streamx-blueprints/rendering-engine:3.0.27-native
        incoming:
          data: { }
          renderers: { }
          rendering-contexts: { }
        outgoing:
          pages: { }
          fragments: { }
        autoRef:
          - from: outgoing-rendering-requests
            to: incoming-rendering-requests
            using: internal-relay
          - from: data
            to: data-state
            using: sync-state
          - from: renderers
            to: renderers-state
            using: sync-state
          - from: rendering-contexts
            to: rendering-contexts-state
            using: sync-state
        volumes:
          - rocksdb:/var/lib/rocksdb

  opensearch-sink:
    type: edge
    volumes:
      opensearch-data:
        size: 20Gi
        persistent: true
      rocksdb:
        size: 20Gi
        persistent: true
    containers:
      sink:
        image: ghcr.io/streamx-hub/streamx-blueprints/opensearch-sink:3.0.27-native
        incoming:
          indexable-resources:
            initState: delta
          indexable-resource-fragments:
            initState: delta
        servicePorts:
          - 8082:8080
        volumes:
          - opensearch-data:/usr/share/opensearch/data
          - rocksdb:/var/lib/rocksdb
        environment:
          QUARKUS_ELASTICSEARCH_HOSTS: ${STREAMX_SERVICE_ID}.opensearch:9201
      opensearch:
        image: registry.prod-ext.streamx.cloud/streamx-docker-hub-public-proxy/opensearchproject/opensearch:2.16.0
        servicePorts:
          - 9201:9201
        volumes:
          - opensearch-data:/usr/share/opensearch/data
        environment:
          network.host: 0.0.0.0
          http.port: "9201"
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"

  web-server-sink:
    type: edge
    volumes:
      repository-volume:
        size: 20Gi
        persistent: true
    containers:
      sink:
        image: ghcr.io/streamx-hub/streamx-blueprints/web-server-sink:3.0.27-native
        incoming:
          resources:
            initState: delta
        servicePorts:
          - 8083:8080
        volumes:
          - repository-volume:/srv/www
        environment:
          STREAMX_BLUEPRINTS_WEB_SERVER_SINK_STORAGE_ROOT_DIRECTORY: /srv/www
      webserver:
        image: registry.prod-ext.streamx.cloud/streamx-docker-hub-public-proxy/library/nginx:1.26.0
        servicePorts:
          - 8084:80
        volumes:
          - repository-volume:/usr/share/nginx/html

networking:
  httpRoutes:
    ingestion-route:
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - name: ingestion/rest-ingestion
              port: 8080
    web-server-and-search-route:
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /search
          backendRefs:
            - name: edge/opensearch-sink
              port: 8082
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - name: edge/web-server-sink
              port: 8084

sources:
  github:
    outgoing:
      - ref: inbox.pages
        produces:
          - com.streamx.blueprints.page.published.v1
          - com.streamx.blueprints.page.unpublished.v1
      - ref: inbox.renderers
        produces:
          - com.streamx.blueprints.renderer.published.v1
          - com.streamx.blueprints.renderer.unpublished.v1
      - ref: inbox.rendering-contexts
        produces:
          - com.streamx.blueprints.rendering-context.published.v1
          - com.streamx.blueprints.rendering-context.unpublished.v1

ingestion:
  rest-ingestion:
    containers:
      proxy:
        environment:
          # Ensures that generated tokens would work between cluster restarts
          STREAMX_SOURCES_GITHUB_ACCEPT_IAT_FROM: "1704067200"
          STREAMX_SOURCES_EDS_ACCEPT_IAT_FROM: "1704067200"

processing:
  indexable-resources-relay:
    descriptor: relay
    containers:
      service:
        incoming:
          events:
            ref: relay.indexable-resources
        outgoing:
          relayed-events:
            ref: outbox.indexable-resources

  indexable-resources-producer:
    descriptor: indexable-resources-producer
    containers:
      processor:
        incoming:
          pages:
            ref: relay.pages
          fragments:
            ref: relay.fragments
        outgoing:
          indexable-resources:
            ref: relay.indexable-resources
          indexable-resource-fragments:
            ref: outbox.indexable-resource-fragments
        environment:
          QUARKUS_CONFIG_LOCATIONS: "/deployments/config/application.yaml"
        volumesFrom:
          configs:
            - "indexable-resources-producer.yaml:/deployments/config/application.yaml"

  indexable-resources-sql-transformer:
    descriptor: indexable-resources-sql-transformer
    containers:
      processor:
        incoming:
          indexable-resources:
            ref: relay.indexable-resources
        outgoing:
          transformations:
            ref: relay.data
        environment:
          QUARKUS_CONFIG_LOCATIONS: "/deployments/config/application.yaml"
        volumesFrom:
          configs:
            - "indexable-resources-sql-transformer.yaml:/deployments/config/application.yaml"

  rendering-engine:
    descriptor: rendering-engine
    containers:
      processor:
        incoming:
          data:
            ref: relay.data
          renderers:
            ref: inbox.renderers
          rendering-contexts:
            ref: inbox.rendering-contexts
        outgoing:
          pages:
            ref: outbox.web-resources
          fragments:
            ref: outbox.fragments

edge:
  opensearch-sink:
    descriptor: opensearch-sink
    containers:
      sink:
        incoming:
          indexable-resources:
            ref: outbox.indexable-resources
          indexable-resource-fragments:
            ref: outbox.indexable-resource-fragments
        volumesFrom:
          configs:
            - opensearch/service-init:/deployments/opensearch/service-init/additional
        environmentFrom:
          secrets:
            - encrypted/opensearch-sink.properties

      opensearch:
        environmentFrom:
          secrets:
            - encrypted/opensearch-sink-opensearch.properties

  web-server-sink:
    descriptor: web-server-sink
    containers:
      sink:
        incoming:
          resources:
            ref: outbox.web-resources
        environmentFrom:
          configs:
            - web-server-sink.properties

      webserver:
        volumesFrom:
          configs:
            - nginx_conf/default.conf:/etc/nginx/conf.d/default.conf