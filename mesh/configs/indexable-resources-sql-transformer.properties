streamx.blueprints.indexable-resources-sql-transformer.persisted-data.include-content=false
streamx.blueprints.indexable-resources-sql-transformer.persisted-data.fields=url,author,description,publication_date,modification_date
streamx.blueprints.indexable-resources-sql-transformer.persisted-data.facets=category
streamx.blueprints.indexable-resources-sql-transformer.transformations.latest-articles-rss.sql-query=SELECT r.* FROM indexable_resource r LEFT JOIN indexable_resource_fields f ON f.resource_subject = r.subject AND f.key = 'publication_date' ORDER BY f.value IS NULL, f.value DESC
