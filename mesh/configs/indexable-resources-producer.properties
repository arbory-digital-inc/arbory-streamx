streamx.blueprints.indexable-resources-producer.index-fragments=false

streamx.blueprints.indexable-resources-producer.search-feed-extractor.xpath.fields.eds.facet=true
streamx.blueprints.indexable-resources-producer.search-feed-extractor.xpath.fields.eds.element-selector=//*[local-name()='meta'][starts-with(@property, 'facets:')]
streamx.blueprints.indexable-resources-producer.search-feed-extractor.xpath.fields.eds.key-selector=./@property
streamx.blueprints.indexable-resources-producer.search-feed-extractor.xpath.fields.eds.value-selector=./@content
streamx.blueprints.indexable-resources-producer.search-feed-extractor.xpath.fields.eds.key-processors.trim.name=trim
streamx.blueprints.indexable-resources-producer.search-feed-extractor.xpath.fields.eds.key-processors.lowercase.name=lowercase
streamx.blueprints.indexable-resources-producer.search-feed-extractor.xpath.fields.eds.key-processors.removeStart.name=removeStart
streamx.blueprints.indexable-resources-producer.search-feed-extractor.xpath.fields.eds.key-processors.removeStart.config=facets:

streamx.blueprints.indexable-resources-producer.search-feed-extractor.xpath.fields.eds.value-processors.trim.name=trim

# RSM-style taxonomy. EDS renders the authored `searchtags` metadata row as a
# single <meta name="searchtags"> whose content holds every entry, comma-joined:
#   Arbory Display | Content type / Blogs, Arbory Display | tags / AEM, ...
# The `eds` configuration above cannot pick it up - that selector requires a
# `facets:` prefix - so capture it here under the key `searchtags`. It lands in
# payload.facets.searchtags as one opaque string and is split into
# category_level0/1 + category_hierarchy by the default-local ingest pipeline
# (see mesh/configs/opensearch/service-init/V1.0.0.7.1__*_default_pipeline.http),
# because a single meta tag cannot carry the array that multi-value faceting
# needs.
streamx.blueprints.indexable-resources-producer.search-feed-extractor.xpath.fields.searchtags.facet=true
streamx.blueprints.indexable-resources-producer.search-feed-extractor.xpath.fields.searchtags.element-selector=//*[local-name()='meta'][@name='searchtags']
streamx.blueprints.indexable-resources-producer.search-feed-extractor.xpath.fields.searchtags.key=searchtags
streamx.blueprints.indexable-resources-producer.search-feed-extractor.xpath.fields.searchtags.value-selector=./@content