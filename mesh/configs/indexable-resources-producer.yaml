streamx:
  blueprints:
    indexable-resources-producer:
      index-fragments: false

      search-feed-extractor:
        xpath:
          fields:
            eds:
              facet: true
              element-selector: "//*[local-name()='meta'][starts-with(@property, 'facets:')]"
              key-selector: "./@property"
              value-selector: "./@content"
              key-processors:
                - name: trim
                - name: lowercase
                - name: removeStart
                  config: "facets:"
              value-processors:
                - name: trim

            # RSM-style taxonomy. EDS renders the authored `searchtags` metadata row as a
            # single <meta name="searchtags"> whose content holds every entry, comma-joined:
            #   Arbory Display | Content type / Blogs, Arbory Display | tags / AEM, ...
            # The `eds` configuration above cannot pick it up - that selector requires a
            # `facets:` prefix - so capture it here under the key `searchtags`. It lands in
            # payload.facets.searchtags as one opaque string and is split into
            # category_level0/1 + category_hierarchy by the default-local ingest pipeline
            # (see mesh/configs/opensearch/service-init/V1.0.0.7.1__*_default_pipeline.http),
            # because a single meta tag cannot carry the array that multi-value faceting
            # needs.
            searchtags:
              facet: true
              element-selector: "//*[local-name()='meta'][@name='searchtags']"
              key: "searchtags"
              value-selector: "./@content"
              key-processors:
                - name: trim
                - name: lowercase
              value-processors:
                - name: trim

            # ── Search page fields (arbory-pages) ─────────────────────────────────
            # Read from the page <head> that EDS renders from the page metadata. Each
            # lands in payload.facets as <key>_level0/_hierarchy/_path, and the
            # ingest pipeline's `arbory_page_fields` processor turns them into
            # payload.description, payload.date and the five facet families
            # (mesh/sources/painless/arbory_page_fields.painless), then removes them.
            #
            # XPath here fails SILENTLY on anything the producer does not support:
            # starts-with() and positional predicates work; contains() and `and`
            # inside a predicate return nothing (probed 2026-09-17). A fixed `key`
            # keeps only the LAST element its selector matched, so tags are read one
            # position at a time: (//meta[@property='article:tag'])[k], k = 1..16
            # (the most tags any page carried on 2026-11-25 was 16).
            description:
              facet: true
              element-selector: "//*[local-name()='meta'][@name='description']"
              key: "description"
              value-selector: "./@content"
              key-processors:
                - name: trim
                - name: lowercase
              value-processors:
                - name: trim
            # og:image, for the more-like-this cards (search-mlt-suggestions). The
            # pipeline keeps only its path when the site itself serves it.
            image:
              facet: true
              element-selector: "//*[local-name()='meta'][@property='og:image']"
              key: "image"
              value-selector: "./@content"
              key-processors:
                - name: trim
                - name: lowercase
              value-processors:
                - name: trim
            date:
              facet: true
              element-selector: "//*[local-name()='meta'][@name='date']"
              key: "date"
              value-selector: "./@content"
              key-processors:
                - name: trim
                - name: lowercase
              value-processors:
                - name: trim
            category:
              facet: true
              element-selector: "//*[local-name()='meta'][@name='category']"
              key: "category"
              value-selector: "./@content"
              key-processors:
                - name: trim
                - name: lowercase
              value-processors:
                - name: trim
            author:
              facet: true
              element-selector: "//*[local-name()='meta'][@name='author']"
              key: "author"
              value-selector: "./@content"
              key-processors:
                - name: trim
                - name: lowercase
              value-processors:
                - name: trim
            tag1:
              facet: true
              element-selector: "(//*[local-name()='meta'][@property='article:tag'])[1]"
              key: "tag1"
              value-selector: "./@content"
              key-processors:
